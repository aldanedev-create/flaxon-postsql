[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flaxon-postsql"
version = "0.1.0"
description = "Async PostgreSQL connection-pool integration for Flaxon"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Aldane Hutchinson"}]
dependencies = [
    "asyncpg>=0.29",
    "flaxon>=0.2.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/aldanedev-create/flaxon-postsql"
Issues = "https://github.com/aldanedev-create/flaxon-postsql/issues"

[tool.setuptools.packages.find]
where = ["src"]
